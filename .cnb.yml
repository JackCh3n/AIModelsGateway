# ============================================================
# AI Models Gateway — CNB.cool 云原生构建流水线
# 功能对齐 GitHub Actions (.github/workflows/build.yml)：
#   - 多平台交叉编译（Windows/Linux/macOS/FreeBSD x amd64/arm64/国产芯片）
#   - 注入版本号（Tag 推送用 Tag 名，普通 push 用日期时间）
#   - 自动发布 Release 并上传构建产物附件
#
# 触发方式：
#   1. 推送 tag（如 git tag v1.0.0 && git push origin v1.0.0）→ 正式发版
#   2. 推送 master 分支代码 → 自动构建 + 打时间戳 Release
#   3. 在流水线页面手动触发（web_trigger）
#
# 共用构建逻辑见 scripts/build-all.sh / scripts/gen-release-notes.sh
# ============================================================

# --- 兜底分支：Tag 推送正式发版 + 手动触发 ---
"$":
  tag_push:
    - name: release-build
      runner:
        cpus: 8
      docker:
        image: golang:1.25
      stages:
        - name: build-all
          script: bash ./scripts/build-all.sh "$CNB_BRANCH"

        - name: gen-changelog
          script: bash ./scripts/gen-release-notes.sh "$CNB_BRANCH"

        - name: create-release
          type: git:release
          options:
            descriptionFromFile: RELEASE_NOTES.md
            latest: true

        # tag_push 事件下 tag 自动取 $CNB_BRANCH，无需指定
        - name: upload-assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist/*"

  web_trigger:
    - name: manual-release
      runner:
        cpus: 8
      docker:
        image: golang:1.25
      stages:
        - name: gen-version
          script: |
            export TZ=Asia/Shanghai
            VERSION="v$(date +'%Y_%m%d_%H%M')"
            echo "==> 构建版本: $VERSION"
            echo "##[set-output VERSION=$VERSION]"
          exports:
            VERSION: BUILD_VERSION

        - name: build-all
          script: bash ./scripts/build-all.sh "$BUILD_VERSION"

        - name: gen-changelog
          script: bash ./scripts/gen-release-notes.sh "$BUILD_VERSION" "由 cnb.cool 云原生构建手动触发生成"

        - name: create-release
          type: git:release
          options:
            tag: $BUILD_VERSION
            descriptionFromFile: RELEASE_NOTES.md
            latest: true

        - name: upload-assets
          image: cnbcool/attachments:latest
          settings:
            tag: $BUILD_VERSION
            attachments:
              - "./dist/*"

# --- master 分支 push：自动构建 + 时间戳版本 Release ---
master:
  push:
    - name: auto-build-release
      runner:
        cpus: 8
      docker:
        image: golang:1.25
      ifModify:
        - "*.go"
        - "go.mod"
        - "go.sum"
        - ".cnb.yml"
        - "scripts/**"
      stages:
        - name: gen-version
          script: |
            export TZ=Asia/Shanghai
            VERSION="v$(date +'%Y_%m%d_%H%M')"
            echo "==> 构建版本: $VERSION"
            echo "##[set-output VERSION=$VERSION]"
          exports:
            VERSION: BUILD_VERSION

        - name: build-all
          script: bash ./scripts/build-all.sh "$BUILD_VERSION"

        - name: gen-changelog
          script: bash ./scripts/gen-release-notes.sh "$BUILD_VERSION" "由 cnb.cool 云原生构建在 master push 时自动生成"

        - name: create-release
          type: git:release
          options:
            tag: $BUILD_VERSION
            descriptionFromFile: RELEASE_NOTES.md
            latest: true

        - name: upload-assets
          image: cnbcool/attachments:latest
          settings:
            tag: $BUILD_VERSION
            attachments:
              - "./dist/*"
